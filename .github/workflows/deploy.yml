# Manual only. Nothing is published on push or PR.
name: Publish website to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      confirm_launch:
        description: "Type PUBLISH after completing docs/LAUNCH.md and configuring the custom domain"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.confirm_launch == 'PUBLISH'
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://moxinadvisory.com' }}
      PUBLIC_INDEXING: ${{ vars.PUBLIC_INDEXING || 'false' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
